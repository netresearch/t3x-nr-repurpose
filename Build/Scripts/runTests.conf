# Per-extension settings for the shared test runner — see
# .Build/vendor/netresearch/typo3-ci-workflows/assets/Build/Scripts/runTests.conf.dist
# This extension keeps its PHPUnit configs under Build/phpunit/ and its
# PHPStan config at the repository root.
PHPUNIT_CONFIG="Build/phpunit/UnitTests.xml"
PHPUNIT_FUNCTIONAL_CONFIG="Build/phpunit/FunctionalTests.xml"
PHPSTAN_CONFIG="phpstan.neon"
RECTOR_CONFIG="Build/rector.php"
