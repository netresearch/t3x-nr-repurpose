<html data-namespace-typo3-fluid="true"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">
<f:comment><!--
    Result of a text format (executive summary, FAQ, social post, newsletter): the
    structured answer from metadata.content. Every value is LLM output and therefore
    untrusted — Fluid's default escaping keeps it inert; never add f:format.raw here.
    TextArtifactRenderingTest renders this partial with markup in every field.
--></f:comment>
<f:variable name="content" value="{artifact.metadataArray.content}" />
<f:if condition="{artifact.type} == 'exec_summary'">
    <p>{artifact.scriptText}</p>
</f:if>
<f:if condition="{artifact.type} == 'faq'">
    <dl>
        <f:for each="{content.faq}" as="pair">
            <dt>{pair.question}</dt>
            <dd>{pair.answer}</dd>
        </f:for>
    </dl>
    <f:if condition="{content.jsonLd}">
        <details>
            <summary><f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:show.faq.jsonLd" /></summary>
            <pre style="white-space: pre-wrap;">{content.jsonLd}</pre>
        </details>
    </f:if>
    <f:render section="ClosingLine" arguments="{line: content.closingLine}" />
</f:if>
<f:if condition="{artifact.type} == 'social_post'">
    <pre style="white-space: pre-wrap; font-family: inherit;">{artifact.scriptText}</pre>
    <p class="text-muted small">
        <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:show.social.length" arguments="{0: content.length, 1: content.maxChars}" />
        <f:comment><!-- cutMode is absent on rows stored before it existed: those say "sentence", as they did then --></f:comment>
        <f:if condition="{content.cutMode} == 'word'">
            <f:then><f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:show.social.truncated.word" /></f:then>
            <f:else><f:if condition="{content.truncated}"><f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:show.social.truncated" /></f:if></f:else>
        </f:if>
        <f:if condition="{content.hashtagsDropped}"><f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:show.social.hashtagsDropped" arguments="{0: content.hashtagsDropped}" /></f:if>
    </p>
</f:if>
<f:if condition="{artifact.type} == 'newsletter'">
    <dl>
        <dt><f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:show.newsletter.subject" /></dt>
        <dd>{content.subject}</dd>
        <dt><f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:show.newsletter.preheader" /></dt>
        <dd>{content.preheader}</dd>
    </dl>
    <f:for each="{content.paragraphs}" as="paragraph">
        <p>{paragraph}</p>
    </f:for>
    <p><strong>{content.callToAction}</strong></p>
    <f:render section="ClosingLine" arguments="{line: content.closingLine}" />
</f:if>
<f:comment><!--
    The optional AI closing line (setting aiLabelTexts, ADR-005) is part of the copy-ready
    text. The executive summary and the social posts show that text itself; the FAQ and
    the newsletter show their structured content, so the line is shown here.
--></f:comment>
<f:section name="ClosingLine">
    <f:if condition="{line}">
        <p class="text-muted small">
            <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:show.aiLabel.closingLine" />
            {line}
        </p>
    </f:if>
</f:section>
</html>
