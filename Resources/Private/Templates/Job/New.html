<html data-namespace-typo3-fluid="true" xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">
<f:layout name="Module" />
<f:section name="Content">
    <h1><f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.title" /></h1>

    <f:form action="create" name="newJob" object="{newJob}">
        <div class="form-group">
            <label class="form-label" for="nrrepurpose-sourceType">
                <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.field.sourceType" />
            </label>
            <f:form.select property="sourceType" id="nrrepurpose-sourceType" class="form-select"
                options="{
                    url: '{f:translate(key: \'LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:sourceType.url\')}',
                    pdf_url: '{f:translate(key: \'LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:sourceType.pdf_url\')}',
                    page: '{f:translate(key: \'LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:sourceType.page\')}',
                    pdf_fal: '{f:translate(key: \'LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:sourceType.pdf_fal\')}'
                }" />
        </div>

        <f:comment><!-- job-new.js shows the blocks whose data-source-types hold the selected type. --></f:comment>
        <div class="form-group" data-source-types="url pdf_url">
            <label class="form-label" for="nrrepurpose-sourceValue">
                <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.field.sourceValue" />
            </label>
            <f:form.textfield property="sourceValue" id="nrrepurpose-sourceValue" class="form-control"
                placeholder="{f:translate(key: 'LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.field.sourceValue.placeholder')}" />
        </div>

        <div class="form-group" data-source-types="page" data-source-picker data-required-message="{f:translate(key: 'LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.field.sourcePage.required')}">
            <label class="form-label" for="nrrepurpose-sourcePage-browse">
                <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.field.sourcePage" />
            </label>
            <f:form.hidden name="sourcePage" id="nrrepurpose-sourcePage" value="{sourcePage.uid}" />
            <div class="input-group">
                <f:comment><!-- The picked item's title and id, or the text that nothing is picked. --></f:comment>
                <output class="form-control text-truncate" id="nrrepurpose-sourcePage-item" for="nrrepurpose-sourcePage-browse"
                        data-empty-label="{f:translate(key: 'LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.field.sourcePage.empty')}">{sourcePage.label}</output>
                <button type="button" class="btn btn-default" id="nrrepurpose-sourcePage-browse" data-picker-browse
                        data-browser-url="{pageBrowserUrl}" aria-describedby="nrrepurpose-sourcePage-item">
                    <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.field.sourcePage.browse" />
                </button>
                <button type="button" class="btn btn-default" data-picker-remove
                        aria-label="{f:translate(key: 'LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.field.sourcePage.remove')}">
                    <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.field.remove" />
                </button>
            </div>
            <div class="invalid-feedback text-danger" data-picker-error></div>
        </div>

        <div class="form-group" data-source-types="page">
            <label class="form-label" for="nrrepurpose-sourceDepth">
                <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.field.sourceDepth" />
            </label>
            <f:form.select name="sourceDepth" id="nrrepurpose-sourceDepth" class="form-select" options="{depthOptions}" value="{selected.sourceDepth}" />
            <p class="form-text">
                <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.hint.sourcePage" arguments="{0: maxPages, 1: maxChars}" />
            </p>
        </div>

        <div class="form-group" data-source-types="pdf_fal" data-source-picker data-required-message="{f:translate(key: 'LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.field.sourceFile.required')}">
            <label class="form-label" for="nrrepurpose-sourceFile-browse">
                <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.field.sourceFile" />
            </label>
            <f:form.hidden name="sourceFile" id="nrrepurpose-sourceFile" />
            <div class="input-group">
                <output class="form-control text-truncate" id="nrrepurpose-sourceFile-item" for="nrrepurpose-sourceFile-browse"
                        data-empty-label="{f:translate(key: 'LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.field.sourceFile.empty')}"></output>
                <button type="button" class="btn btn-default" id="nrrepurpose-sourceFile-browse" data-picker-browse
                        data-browser-url="{fileBrowserUrl}" aria-describedby="nrrepurpose-sourceFile-item">
                    <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.field.sourceFile.browse" />
                </button>
                <button type="button" class="btn btn-default" data-picker-remove
                        aria-label="{f:translate(key: 'LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.field.sourceFile.remove')}">
                    <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.field.remove" />
                </button>
            </div>
            <div class="invalid-feedback text-danger" data-picker-error></div>
        </div>

        <div class="form-group" data-source-types="pdf_url pdf_fal">
            <label class="form-label" for="nrrepurpose-pdfMode">
                <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.field.pdfMode" />
            </label>
            <f:form.select property="pdfMode" id="nrrepurpose-pdfMode" class="form-select"
                options="{
                    auto: '{f:translate(key: \'LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:pdfMode.auto\')}',
                    text: '{f:translate(key: \'LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:pdfMode.text\')}',
                    vision: '{f:translate(key: \'LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:pdfMode.vision\')}',
                    tables: '{f:translate(key: \'LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:pdfMode.tables\')}'
                }" />
        </div>

        <div class="form-group">
            <label class="form-label" for="nrrepurpose-theme">
                <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.field.theme" />
            </label>
            <f:form.select property="theme" id="nrrepurpose-theme" class="form-select"
                options="{
                    nr: '{f:translate(key: \'LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:theme.nr\')}',
                    neutral: '{f:translate(key: \'LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:theme.neutral\')}'
                }" />
        </div>

        <f:comment><!--
            Prompt-snippet selectors (nr_llm PromptSnippet library). Audience and tone steer
            every artifact; the per-artifact selectors live inside the artifact cards below.
            All optional — "(none)" keeps the previous, snippet-free prompts.
        --></f:comment>
        <div class="form-group">
            <label class="form-label" for="nrrepurpose-snippetAudience">
                <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.snippet.audience" />
            </label>
            <f:form.select name="snippetAudience" id="nrrepurpose-snippetAudience" class="form-select" value="{selected.snippetAudience}"
                options="{audienceOptions}"
                prependOptionLabel="{f:translate(key: 'LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.snippet.none')}"
                prependOptionValue="0" />
        </div>

        <div class="form-group">
            <label class="form-label" for="nrrepurpose-snippetTone">
                <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.snippet.tone" />
            </label>
            <f:form.select name="snippetTone" id="nrrepurpose-snippetTone" class="form-select" value="{selected.snippetTone}"
                options="{toneOptions}"
                prependOptionLabel="{f:translate(key: 'LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.snippet.none')}"
                prependOptionValue="0" />
        </div>

        <fieldset class="form-group">
            <legend class="form-label">
                <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.section.artifacts" />
            </legend>
            <div class="row g-3">
                <div class="col-md-4">
                    <div class="card h-100">
                        <div class="card-body">
                            <div class="form-check">
                                <f:form.checkbox property="wantPodcast" value="1" id="nrrepurpose-wantPodcast" class="form-check-input" />
                                <label class="form-check-label fw-bold" for="nrrepurpose-wantPodcast">
                                    <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:artifact.podcast" />
                                </label>
                            </div>
                            <p class="card-text text-muted small">
                                <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:artifact.podcast.desc" />
                            </p>
                            <f:for each="{1: '1', 2: '2', 3: '3'}" as="slot" key="slotIndex">
                                <div class="form-group mb-2">
                                    <label class="form-label" for="nrrepurpose-snippetPersona{slot}">
                                        <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.snippet.persona" arguments="{0: slot}" />
                                    </label>
                                    <f:form.select name="snippetPersona{slot}" id="nrrepurpose-snippetPersona{slot}" class="form-select" value="{selected.snippetPersona{slot}}"
                                        options="{personaOptions}"
                                        prependOptionLabel="{f:translate(key: 'LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.snippet.none')}"
                                        prependOptionValue="0" />
                                </div>
                            </f:for>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card h-100">
                        <div class="card-body">
                            <div class="form-check">
                                <f:form.checkbox property="wantSchaubild" value="1" id="nrrepurpose-wantSchaubild" class="form-check-input" />
                                <label class="form-check-label fw-bold" for="nrrepurpose-wantSchaubild">
                                    <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:artifact.schaubild" />
                                </label>
                            </div>
                            <p class="card-text text-muted small">
                                <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:artifact.schaubild.desc" />
                            </p>
                            <div class="form-group mb-2">
                                <label class="form-label" for="nrrepurpose-snippetSchaubildLayout">
                                    <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.snippet.layout" />
                                </label>
                                <f:form.select name="snippetSchaubildLayout" id="nrrepurpose-snippetSchaubildLayout" class="form-select" value="{selected.snippetSchaubildLayout}"
                                    options="{layoutOptions}"
                                    prependOptionLabel="{f:translate(key: 'LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.snippet.none')}"
                                    prependOptionValue="0" />
                            </div>
                            <div class="form-group mb-2">
                                <label class="form-label" for="nrrepurpose-snippetSchaubildStyle">
                                    <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.snippet.style" />
                                </label>
                                <f:form.select name="snippetSchaubildStyle" id="nrrepurpose-snippetSchaubildStyle" class="form-select" value="{selected.snippetSchaubildStyle}"
                                    options="{styleOptions}"
                                    prependOptionLabel="{f:translate(key: 'LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.snippet.none')}"
                                    prependOptionValue="0" />
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card h-100">
                        <div class="card-body">
                            <div class="form-check">
                                <f:form.checkbox property="wantStory" value="1" id="nrrepurpose-wantStory" class="form-check-input" />
                                <label class="form-check-label fw-bold" for="nrrepurpose-wantStory">
                                    <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:artifact.story" />
                                </label>
                            </div>
                            <p class="card-text text-muted small">
                                <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:artifact.story.desc" />
                            </p>
                            <div class="form-check mb-2">
                                <f:form.checkbox property="wantVideo" value="1" id="nrrepurpose-wantVideo" class="form-check-input" />
                                <label class="form-check-label" for="nrrepurpose-wantVideo">
                                    <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:artifact.video.option" />
                                </label>
                            </div>
                            <div class="form-group mb-2">
                                <label class="form-label" for="nrrepurpose-snippetStoryLayout">
                                    <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.snippet.layout" />
                                </label>
                                <f:form.select name="snippetStoryLayout" id="nrrepurpose-snippetStoryLayout" class="form-select" value="{selected.snippetStoryLayout}"
                                    options="{layoutOptions}"
                                    prependOptionLabel="{f:translate(key: 'LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.snippet.none')}"
                                    prependOptionValue="0" />
                            </div>
                            <div class="form-group mb-2">
                                <label class="form-label" for="nrrepurpose-snippetStoryStyle">
                                    <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.snippet.style" />
                                </label>
                                <f:form.select name="snippetStoryStyle" id="nrrepurpose-snippetStoryStyle" class="form-select" value="{selected.snippetStoryStyle}"
                                    options="{styleOptions}"
                                    prependOptionLabel="{f:translate(key: 'LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.snippet.none')}"
                                    prependOptionValue="0" />
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <f:comment><!-- Text formats: opt-in (unchecked), one structured LLM call each, no audio or imagery --></f:comment>
            <div class="row g-3 mt-1">
                <div class="col-md-3">
                    <div class="card h-100">
                        <div class="card-body">
                            <div class="form-check">
                                <f:form.checkbox property="wantExecSummary" value="1" id="nrrepurpose-wantExecSummary" class="form-check-input" />
                                <label class="form-check-label fw-bold" for="nrrepurpose-wantExecSummary">
                                    <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:artifact.exec_summary" />
                                </label>
                            </div>
                            <p class="card-text text-muted small">
                                <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:artifact.exec_summary.desc" />
                            </p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card h-100">
                        <div class="card-body">
                            <div class="form-check">
                                <f:form.checkbox property="wantFaq" value="1" id="nrrepurpose-wantFaq" class="form-check-input" />
                                <label class="form-check-label fw-bold" for="nrrepurpose-wantFaq">
                                    <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:artifact.faq" />
                                </label>
                            </div>
                            <p class="card-text text-muted small">
                                <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:artifact.faq.desc" />
                            </p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card h-100">
                        <div class="card-body">
                            <div class="form-check">
                                <f:form.checkbox property="wantSocialPost" value="1" id="nrrepurpose-wantSocialPost" class="form-check-input" />
                                <label class="form-check-label fw-bold" for="nrrepurpose-wantSocialPost">
                                    <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:artifact.social_post" />
                                </label>
                            </div>
                            <p class="card-text text-muted small">
                                <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:artifact.social_post.desc" />
                            </p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card h-100">
                        <div class="card-body">
                            <div class="form-check">
                                <f:form.checkbox property="wantNewsletter" value="1" id="nrrepurpose-wantNewsletter" class="form-check-input" />
                                <label class="form-check-label fw-bold" for="nrrepurpose-wantNewsletter">
                                    <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:artifact.newsletter" />
                                </label>
                            </div>
                            <p class="card-text text-muted small">
                                <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:artifact.newsletter.desc" />
                            </p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card h-100">
                        <div class="card-body">
                            <div class="form-check">
                                <f:form.checkbox property="wantSlideDeck" value="1" id="nrrepurpose-wantSlideDeck" class="form-check-input" />
                                <label class="form-check-label fw-bold" for="nrrepurpose-wantSlideDeck">
                                    <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:artifact.slide_deck" />
                                </label>
                            </div>
                            <p class="card-text text-muted small">
                                <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:artifact.slide_deck.desc" />
                            </p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card h-100">
                        <div class="card-body">
                            <div class="form-check">
                                <f:form.checkbox property="wantHandout" value="1" id="nrrepurpose-wantHandout" class="form-check-input" />
                                <label class="form-check-label fw-bold" for="nrrepurpose-wantHandout">
                                    <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:artifact.handout" />
                                </label>
                            </div>
                            <p class="card-text text-muted small">
                                <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:artifact.handout.desc" />
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </fieldset>

        <p>
            <button type="submit" class="btn btn-primary" id="nrrepurpose-submit"
                    data-submitting-label="{f:translate(key: 'LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.submitting')}">
                <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.submit" />
            </button>
            <f:link.action action="list" class="btn btn-default">
                <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:new.cancel" />
            </f:link.action>
            <f:comment><!-- Empty until the form posts: a live region is announced only when it exists before its text changes. --></f:comment>
            <span class="visually-hidden" role="status" id="nrrepurpose-submit-status"></span>
        </p>
    </f:form>
</f:section>
</html>
