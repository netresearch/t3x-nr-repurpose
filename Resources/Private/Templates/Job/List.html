<html data-namespace-typo3-fluid="true"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers">
<f:layout name="Module" />
<f:section name="Content">
    <h1 id="nrrepurpose-list-title"><f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:module.title" /></h1>

    <p>
        <f:link.action action="new" class="btn btn-primary">
            <core:icon identifier="actions-add" size="small" />
            <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:list.action.new" />
        </f:link.action>
        <f:link.action action="plan" class="btn btn-default">
            <core:icon identifier="actions-calendar" size="small" />
            <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:list.action.plan" />
        </f:link.action>
    </p>

    <f:if condition="{jobs}">
        <f:then>
            <div class="table-fit">
                <table class="table table-striped table-hover" aria-labelledby="nrrepurpose-list-title">
                    <thead>
                        <tr>
                            <th scope="col"><f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:list.column.id" /></th>
                            <th scope="col"><f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:list.column.source" /></th>
                            <th scope="col"><f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:list.column.status" /></th>
                            <th scope="col"><f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:list.column.artifacts" /></th>
                            <th scope="col"><f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:list.column.progress" /></th>
                            <th scope="col" class="col-control"><span class="visually-hidden"><f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:list.column.actions" /></span></th>
                        </tr>
                    </thead>
                    <tbody>
                        <f:for each="{jobs}" as="job">
                            <tr>
                                <td>{job.uid}</td>
                                <f:comment><!-- One line with an ellipsis (core .col-responsive): a 400-character tracking URL must not
                                     widen the table. The full value stays in the DOM (copy, screen readers) and in the title (hover). --></f:comment>
                                <td class="col-responsive" title="{job.sourceValue}">{job.sourceValue}</td>
                                <td>
                                    <span class="badge badge-{job.statusEnum.severity}">
                                        <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:{job.statusEnum.labelKey}" />
                                    </span>
                                </td>
                                <td class="col-nowrap">
                                    <f:render partial="Job/ArtifactSummaries" arguments="{summaries: '{artifactSummaries.{job.uid}}'}" />
                                </td>
                                <td class="col-progress">
                                    <f:comment><!--
                                        A native <progress>: it carries the progressbar role, value, range and name itself.
                                        Not the core <typo3-backend-progress-bar>: that element is @internal, its shadow-DOM
                                        progressbar cannot be named, and its dark-scheme fill is below 3:1. Core v14 ships
                                        no .progress/.progress-bar CSS. The percentage beside it repeats the value for sight.
                                    --></f:comment>
                                    <div class="nrrepurpose-progress">
                                        <progress class="nrrepurpose-progress-track" max="100" value="{job.progress}"
                                                  aria-label="{f:translate(key: 'LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:list.progress.label', arguments: {0: job.uid})}"></progress>
                                        <span class="nrrepurpose-progress-value" aria-hidden="true">{job.progress}%</span>
                                    </div>
                                </td>
                                <td class="col-control">
                                    <f:link.action action="show" arguments="{job: job}" class="btn btn-sm btn-default">
                                        <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:list.action.details" />
                                        <span class="visually-hidden">(<f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:show.title" arguments="{0: job.uid}" />)</span>
                                    </f:link.action>
                                </td>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
            </div>
            <f:render partial="Job/Pagination" arguments="{paginator: paginator, pagination: pagination}" />
        </f:then>
        <f:else>
            <div class="callout callout-info">
                <f:translate key="LLL:EXT:nr_repurpose/Resources/Private/Language/locallang.xlf:list.empty" />
            </div>
        </f:else>
    </f:if>
</f:section>
</html>
