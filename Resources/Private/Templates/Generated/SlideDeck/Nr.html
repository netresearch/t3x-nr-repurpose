<f:spaceless>
<!DOCTYPE html>
<html lang="{language}">
<head>
    <meta charset="utf-8">
    <title>{content.title}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Raleway:wght@600;700&family=Open+Sans:wght@400;600&display=swap');
        @page { size: 1920px 1080px; margin: 0; }
        html, body { margin: 0; padding: 0; }
        .slide {
            position: relative;
            box-sizing: border-box;
            width: 1920px;
            height: 1080px;
            padding: 120px 160px;
            overflow: hidden;
            break-after: page;
            display: flex;
            flex-direction: column;
            font-family: 'Open Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: #0f3f44;
            background: #ffffff;
        }
        .slide:last-child { break-after: auto; }
        .slide--title, .slide--closing {
            justify-content: center;
            color: #ffffff;
            /* #1d6f77, not the brand #2F99A4: white text keeps 5.8:1 (WCAG AA) on it. */
            background: linear-gradient(160deg, #1d6f77 0%, #0f3f44 100%);
        }
        .accent { width: 160px; height: 14px; background: #FF4D00; margin-bottom: 48px; }
        h1, h2 { font-family: 'Raleway', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; margin: 0; }
        h1 { font-size: 104px; line-height: 1.1; }
        h2 { font-size: 72px; line-height: 1.15; margin-bottom: 64px; }
        .subtitle { font-size: 44px; line-height: 1.4; margin: 40px 0 0; }
        ul { margin: 0; padding-left: 56px; }
        li { font-size: 44px; line-height: 1.4; margin-bottom: 28px; }
        .takeaway { font-size: 60px; line-height: 1.3; font-weight: 600; margin: 0; }
        .footer {
            position: absolute;
            left: 160px;
            right: 160px;
            bottom: 56px;
            display: flex;
            justify-content: space-between;
            font-size: 24px;
        }
        .footer a { color: inherit; text-decoration: none; }
        .source { word-break: break-all; }
        /* Symbol-only [n] logo (netresearch-branding logo.md) on every slide, since each slide
           is a PDF page. It sits in the 120px top padding, so no heading can run into it. The
           viewBox carries the clear space; the white plate is the solid backing it needs on the
           dark title and closing slides. */
        .slide__header { position: absolute; top: 24px; right: 160px; }
        .nr-logo { display: block; width: 88px; height: 88px; }
        .nr-logo svg { display: block; width: 100%; height: 100%; background: #ffffff; border-radius: 12px; }
        .closing-line { font-size: 28px; margin-top: 56px; }
    </style>
</head>
<body>
    <section class="slide slide--title">
        <header class="slide__header"><a class="nr-logo" href="https://www.netresearch.de/" aria-label="Netresearch DTT GmbH"><svg viewBox="-75 -75 440 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Netresearch symbol logo"><title>Netresearch DTT GmbH</title><path fill="#2F99A4" d="M209.6,0V31.62h32.77a26.38,26.38,0,0,1,26.44,26.43V242a26.38,26.38,0,0,1-26.44,26.44H209.6V300h47.93a42.77,42.77,0,0,0,42.86-42.86V42.89A42.76,42.76,0,0,0,257.53,0ZM43.25,0A42.76,42.76,0,0,0,.39,42.89V257.18A42.76,42.76,0,0,0,43.25,300H91.18V268.46H58.4A26.38,26.38,0,0,1,32,242v-184A26.37,26.37,0,0,1,58.4,31.62H91.18V0Z" transform="translate(-0.39 -0.04)"/><path fill="#585961" d="M221.44,120.41c0-34.48-13.94-57.82-48.93-57.82-26.62,0-48.54,7.74-64.17,26.56l-.7-22.06-28.31.06V232.94h31.59V124.69c7.14-18.38,32.14-34.8,53-34.5,27.38.4,25.2,26.24,26,45.81v96.94h31.58" transform="translate(-0.39 -0.04)"/></svg></a></header>
        <div class="accent"></div>
        <h1>{content.title}</h1>
        <f:if condition="{content.subtitle}"><p class="subtitle">{content.subtitle}</p></f:if>
        <footer class="footer"><a href="https://www.netresearch.de/">Netresearch DTT GmbH</a><span class="source">{sourceLabel}</span></footer>
    </section>
    <f:for each="{content.slides}" as="slide" iteration="i">
        <section class="slide">
            <header class="slide__header"><a class="nr-logo" href="https://www.netresearch.de/" aria-label="Netresearch DTT GmbH"><svg viewBox="-75 -75 440 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Netresearch symbol logo"><title>Netresearch DTT GmbH</title><path fill="#2F99A4" d="M209.6,0V31.62h32.77a26.38,26.38,0,0,1,26.44,26.43V242a26.38,26.38,0,0,1-26.44,26.44H209.6V300h47.93a42.77,42.77,0,0,0,42.86-42.86V42.89A42.76,42.76,0,0,0,257.53,0ZM43.25,0A42.76,42.76,0,0,0,.39,42.89V257.18A42.76,42.76,0,0,0,43.25,300H91.18V268.46H58.4A26.38,26.38,0,0,1,32,242v-184A26.37,26.37,0,0,1,58.4,31.62H91.18V0Z" transform="translate(-0.39 -0.04)"/><path fill="#585961" d="M221.44,120.41c0-34.48-13.94-57.82-48.93-57.82-26.62,0-48.54,7.74-64.17,26.56l-.7-22.06-28.31.06V232.94h31.59V124.69c7.14-18.38,32.14-34.8,53-34.5,27.38.4,25.2,26.24,26,45.81v96.94h31.58" transform="translate(-0.39 -0.04)"/></svg></a></header>
            <h2>{slide.heading}</h2>
            <ul>
                <f:for each="{slide.bullets}" as="bullet"><li>{bullet}</li></f:for>
            </ul>
            <div class="footer"><span>{content.title}</span><span>{i.cycle}/{i.total}</span></div>
        </section>
    </f:for>
    <section class="slide slide--closing">
        <header class="slide__header"><a class="nr-logo" href="https://www.netresearch.de/" aria-label="Netresearch DTT GmbH"><svg viewBox="-75 -75 440 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Netresearch symbol logo"><title>Netresearch DTT GmbH</title><path fill="#2F99A4" d="M209.6,0V31.62h32.77a26.38,26.38,0,0,1,26.44,26.43V242a26.38,26.38,0,0,1-26.44,26.44H209.6V300h47.93a42.77,42.77,0,0,0,42.86-42.86V42.89A42.76,42.76,0,0,0,257.53,0ZM43.25,0A42.76,42.76,0,0,0,.39,42.89V257.18A42.76,42.76,0,0,0,43.25,300H91.18V268.46H58.4A26.38,26.38,0,0,1,32,242v-184A26.37,26.37,0,0,1,58.4,31.62H91.18V0Z" transform="translate(-0.39 -0.04)"/><path fill="#585961" d="M221.44,120.41c0-34.48-13.94-57.82-48.93-57.82-26.62,0-48.54,7.74-64.17,26.56l-.7-22.06-28.31.06V232.94h31.59V124.69c7.14-18.38,32.14-34.8,53-34.5,27.38.4,25.2,26.24,26,45.81v96.94h31.58" transform="translate(-0.39 -0.04)"/></svg></a></header>
        <div class="accent"></div>
        <f:if condition="{content.takeaway}"><p class="takeaway">{content.takeaway}</p></f:if>
        <f:if condition="{content.closingLine}"><p class="closing-line">{content.closingLine}</p></f:if>
        <footer class="footer"><a href="https://www.netresearch.de/">Netresearch DTT GmbH</a><span class="source">{sourceLabel}</span></footer>
    </section>
</body>
</html>
</f:spaceless>
