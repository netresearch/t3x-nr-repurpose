<f:spaceless>
<!DOCTYPE html>
<html lang="{language}">
<head>
    <meta charset="utf-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap');
        :root {
            --nr-primary: #2F99A4;
            --nr-accent: #FF4D00;
            --nr-text: #585961;
            --font-headline: 'Raleway', 'Helvetica Neue', Arial, sans-serif;
            --font-body: 'Open Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        html, body {
            margin: 0;
            padding: 0;
            <f:if condition="{transparent}">
                <f:then>background: transparent;</f:then>
                <f:else>background: #ffffff;</f:else>
            </f:if>
        }
        .schaubild {
            position: relative;
            width: 1200px;
            box-sizing: border-box;
            padding: 64px;
            font-family: var(--font-body);
            color: var(--nr-text);
        }
        .schaubild__header {
            display: flex;
            align-items: flex-start;
            gap: 24px;
            border-bottom: 4px solid var(--nr-accent);
            padding-bottom: 24px;
            margin-bottom: 32px;
        }
        .schaubild__title {
            font-family: var(--font-headline);
            font-weight: 700;
            font-size: 48px;
            line-height: 1.2;
            color: var(--nr-primary);
            margin: 0;
        }
        /* Symbol-only [n] logo (netresearch-branding logo.md). The viewBox carries the clear
           space; the white plate is the solid backing it needs over the KI background. */
        .nr-logo { flex: none; display: block; width: 56px; height: 56px; }
        .nr-logo svg { display: block; width: 100%; height: 100%; background: #ffffff; border-radius: 8px; }
        .schaubild__body { font-size: 20px; line-height: 1.6; }
        .schaubild__body h2,
        .schaubild__body h3 {
            font-family: var(--font-headline);
            color: var(--nr-primary);
        }
        .schaubild__footer { margin-top: 40px; font-size: 14px; color: var(--nr-text); }
        /* #15585E, not the brand #2F99A4: a 14px link needs 4.5:1, #2F99A4 has 3.38:1 on white. */
        .schaubild__footer a { color: #15585E; text-decoration: none; }
        <f:if condition="{transparent}">
            /* Over a KI background the footer gets the logo's white plate, so the link keeps
               its 8.11:1 whatever lies behind it. */
            .schaubild__footer { display: table; padding: 4px 10px; border-radius: 4px; background: #ffffff; }
        </f:if>
        /* Visible AI label (ADR-005): own dark plate, legible over any background. */
        .ai-label {
            position: absolute;
            top: 16px;
            right: 16px;
            padding: 4px 10px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.72);
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.4;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>
    <div class="schaubild">
        <f:if condition="{aiLabel}">
            <div class="ai-label">{aiLabel}</div>
        </f:if>
        <header class="schaubild__header">
            <a class="nr-logo" href="https://www.netresearch.de/" aria-label="Netresearch DTT GmbH"><svg viewBox="-75 -75 440 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Netresearch symbol logo"><title>Netresearch DTT GmbH</title><path fill="#2F99A4" d="M209.6,0V31.62h32.77a26.38,26.38,0,0,1,26.44,26.43V242a26.38,26.38,0,0,1-26.44,26.44H209.6V300h47.93a42.77,42.77,0,0,0,42.86-42.86V42.89A42.76,42.76,0,0,0,257.53,0ZM43.25,0A42.76,42.76,0,0,0,.39,42.89V257.18A42.76,42.76,0,0,0,43.25,300H91.18V268.46H58.4A26.38,26.38,0,0,1,32,242v-184A26.37,26.37,0,0,1,58.4,31.62H91.18V0Z" transform="translate(-0.39 -0.04)"/><path fill="#585961" d="M221.44,120.41c0-34.48-13.94-57.82-48.93-57.82-26.62,0-48.54,7.74-64.17,26.56l-.7-22.06-28.31.06V232.94h31.59V124.69c7.14-18.38,32.14-34.8,53-34.5,27.38.4,25.2,26.24,26,45.81v96.94h31.58" transform="translate(-0.39 -0.04)"/></svg></a>
            <h1 class="schaubild__title">{title}</h1>
        </header>
        <main class="schaubild__body">
            <f:format.raw>{bodyHtml}</f:format.raw>
        </main>
        <footer class="schaubild__footer">
            <a href="https://www.netresearch.de/">Netresearch DTT GmbH</a>
        </footer>
    </div>
</body>
</html>
</f:spaceless>
