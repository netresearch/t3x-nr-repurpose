<f:spaceless>
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Raleway:wght@600;700&family=Open+Sans:wght@400;600&display=swap');
        html, body {
            margin: 0;
            padding: 0;
            width: 1080px;
            height: 1920px;
            <f:if condition="{transparent}">
                <f:then>background: transparent;</f:then>
                <f:else>background: linear-gradient(160deg, #2F99A4 0%, #0f3f44 100%);</f:else>
            </f:if>
        }
        .story {
            position: relative;
            box-sizing: border-box;
            width: 1080px;
            height: 1920px;
            /* The copy stacks from the bottom edge and ends 330px above it, the company line
               included; the logo and the label row start 330px from the top. Meta's Stories
               ads guide asks for 14% of the height (269px) at the top; its 35% at the bottom
               makes room for an ad's call-to-action, which an organic story does not have, so
               the bottom takes the top's 14%. The story video zooms each slide in by 8%
               around its centre (FfmpegSlideshowRenderer), which moves an element d px from
               an edge to 960 - (960 - d) * 1.08: d must be at least 321px to stay out of the
               269px band on the last frame. */
            padding: 120px 96px 330px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            color: #ffffff;
            font-family: 'Open Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        /* AI label and slide indicator, top right, level with the logo. */
        .story__meta {
            position: absolute;
            top: 330px;
            right: 96px;
            display: flex;
            align-items: center;
            gap: 24px;
        }
        .story__indicator {
            font-family: 'Raleway', 'Helvetica Neue', Arial, sans-serif;
            font-weight: 600;
            font-size: 32px;
            letter-spacing: 1px;
            opacity: 0.85;
        }
        .story__accent { width: 120px; height: 12px; background: #FF4D00; margin-bottom: 40px; }
        .story__headline {
            font-family: 'Raleway', 'Helvetica Neue', Arial, sans-serif;
            font-weight: 700;
            font-size: <f:if condition="{role} == 'cover'"><f:then>116px</f:then><f:else>88px</f:else></f:if>;
            line-height: 1.1;
            margin: 0 0 32px;
        }
        .story__subline { font-size: 40px; line-height: 1.4; font-weight: 400; margin: 0; }
        .story__source { font-size: 30px; line-height: 1.4; font-weight: 400; margin: 48px 0 0; opacity: 0.8; word-break: break-all; }
        .story__brand { margin-top: 64px; font-family: 'Raleway', sans-serif; font-weight: 600; font-size: 28px; letter-spacing: 0.5px; }
        .story__brand a { color: inherit; text-decoration: none; }
        <f:if condition="{transparent}">
            /* Over a KI background the white line has no backing of its own: the logo's white
               plate with the darker teal, 8.11:1 (netresearch-branding colors.md). */
            .story__brand { align-self: flex-start; padding: 8px 20px; border-radius: 8px; background: #ffffff; color: #15585E; }
            /* Over a KI background the white copy has no backing of its own, and a light image
               leaves it white on white: headline, subline, source and slide indicator sit on the
               dark end of the opaque gradient, line by line (#0f3f44, 11.57:1 for white). */
            .story__plate { background: #0f3f44; padding: 4px 16px; border-radius: 8px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
            .story__source, .story__indicator { opacity: 1; }
            .story__indicator { background: #0f3f44; padding: 8px 20px; border-radius: 8px; }
        </f:if>
        /* Symbol-only [n] logo (netresearch-branding logo.md), 120px as the visual anchor,
           below the band the story UI covers (see .story). The viewBox carries the clear
           space; the white plate is the solid backing it needs on the teal gradient and over
           a KI background. */
        .story__header { position: absolute; top: 330px; left: 96px; }
        .nr-logo { display: block; width: 120px; height: 120px; }
        .nr-logo svg { display: block; width: 100%; height: 100%; background: #ffffff; border-radius: 16px; }
        /* Visible AI label (ADR-005): own dark plate, legible over any background. */
        .ai-label {
            padding: 8px 20px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.72);
            color: #ffffff;
            font-size: 28px;
            font-weight: 600;
            line-height: 1.4;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="story">
        <div class="story__meta">
            <f:if condition="{aiLabel}">
                <div class="ai-label">{aiLabel}</div>
            </f:if>
            <f:if condition="{role} != 'cover'">
                <div class="story__indicator">{slideIndex}/{slideTotal}</div>
            </f:if>
        </div>
        <header class="story__header"><a class="nr-logo" href="https://www.netresearch.de/" aria-label="Netresearch DTT GmbH"><svg viewBox="-75 -75 440 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Netresearch symbol logo"><title>Netresearch DTT GmbH</title><path fill="#2F99A4" d="M209.6,0V31.62h32.77a26.38,26.38,0,0,1,26.44,26.43V242a26.38,26.38,0,0,1-26.44,26.44H209.6V300h47.93a42.77,42.77,0,0,0,42.86-42.86V42.89A42.76,42.76,0,0,0,257.53,0ZM43.25,0A42.76,42.76,0,0,0,.39,42.89V257.18A42.76,42.76,0,0,0,43.25,300H91.18V268.46H58.4A26.38,26.38,0,0,1,32,242v-184A26.37,26.37,0,0,1,58.4,31.62H91.18V0Z" transform="translate(-0.39 -0.04)"/><path fill="#585961" d="M221.44,120.41c0-34.48-13.94-57.82-48.93-57.82-26.62,0-48.54,7.74-64.17,26.56l-.7-22.06-28.31.06V232.94h31.59V124.69c7.14-18.38,32.14-34.8,53-34.5,27.38.4,25.2,26.24,26,45.81v96.94h31.58" transform="translate(-0.39 -0.04)"/></svg></a></header>
        <div class="story__accent"></div>
        <h1 class="story__headline"><span class="story__plate">{headline}</span></h1>
        <p class="story__subline"><span class="story__plate">{subline}</span></p>
        <f:if condition="{role} == 'outro'">
            <p class="story__source"><span class="story__plate">{sourceLabel}</span></p>
        </f:if>
        <footer class="story__brand"><a href="https://www.netresearch.de/">Netresearch DTT GmbH</a></footer>
    </div>
</body>
</html>
</f:spaceless>
