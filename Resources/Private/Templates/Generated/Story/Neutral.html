<f:spaceless>
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        html, body {
            margin: 0;
            padding: 0;
            width: 1080px;
            height: 1920px;
            <f:if condition="{transparent}">
                <f:then>background: transparent;</f:then>
                <f:else>background: linear-gradient(160deg, #1f2933 0%, #3b4654 100%);</f:else>
            </f:if>
        }
        .story {
            position: relative;
            box-sizing: border-box;
            width: 1080px;
            height: 1920px;
            /* The copy ends 330px above the bottom edge, and the label row starts 330px from
               the top, out of the band the story UI covers — see Story/Nr.html for the 14% of
               Meta's Stories ads guide and the 8% zoom of the story video behind 330px. */
            padding: 120px 96px 330px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            color: #ffffff;
            font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        }
        /* AI label and slide indicator, top right. */
        .story__meta {
            position: absolute;
            top: 330px;
            right: 96px;
            display: flex;
            align-items: center;
            gap: 24px;
        }
        .story__indicator {
            font-weight: 600;
            font-size: 32px;
            letter-spacing: 1px;
            opacity: 0.85;
        }
        .story__accent { width: 120px; height: 12px; background: #3b6ef5; margin-bottom: 40px; }
        .story__headline {
            font-weight: 700;
            font-size: <f:if condition="{role} == 'cover'"><f:then>116px</f:then><f:else>88px</f:else></f:if>;
            line-height: 1.1;
            margin: 0 0 32px;
            /* A long compound ("Mehrfamilienhaus:") is wider than the 888px line at 116px. */
            overflow-wrap: break-word;
        }
        .story__subline { font-size: 40px; line-height: 1.4; font-weight: 400; margin: 0; }
        .story__source { font-size: 30px; line-height: 1.4; font-weight: 400; margin: 48px 0 0; opacity: 0.8; word-break: break-all; }
        <f:if condition="{transparent}">
            /* Over a KI background the white copy has no backing of its own, and a light image
               leaves it white on white: headline, subline, source and slide indicator sit on the
               dark end of the opaque gradient, line by line (#1f2933, 14.76:1 for white). */
            .story__plate { background: #1f2933; padding: 4px 16px; border-radius: 8px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
            .story__source, .story__indicator { opacity: 1; }
            .story__indicator { background: #1f2933; padding: 8px 20px; border-radius: 8px; }
        </f:if>
        /* Visible AI label (ADR-005): own dark plate, legible over any background. */
        .ai-label {
            padding: 8px 20px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.72);
            color: #ffffff;
            font-size: 28px;
            font-weight: 600;
            line-height: 1.4;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="story">
        <div class="story__meta">
            <f:if condition="{aiLabel}">
                <div class="ai-label">{aiLabel}</div>
            </f:if>
            <f:if condition="{role} != 'cover'">
                <div class="story__indicator">{slideIndex}/{slideTotal}</div>
            </f:if>
        </div>
        <div class="story__accent"></div>
        <h1 class="story__headline"><span class="story__plate">{headline}</span></h1>
        <p class="story__subline"><span class="story__plate">{subline}</span></p>
        <f:if condition="{role} == 'outro'">
            <p class="story__source"><span class="story__plate">{sourceLabel}</span></p>
        </f:if>
    </div>
</body>
</html>
</f:spaceless>
